<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <defs>
    <linearGradient id="grad_link_conner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="200" height="140" rx="14" fill="url(#grad_link_conner)" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.4" />
  <!-- INDUSTRIAL GRID LINES -->
  <path d="M10 35 h180 M10 105 h180 M50 10 v120 M150 10 v120" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  
  <!-- MACHINE CODE BADGE -->
  <rect x="14" y="14" width="60" height="18" rx="5" fill="rgba(255,255,255,0.12)" />
  <text x="44" y="27" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="0.5">CONE</text>

  <!-- LIVE SENSOR STATUS LED -->
  <circle cx="180" cy="23" r="4" fill="#C084FC" />
  <circle cx="180" cy="23" r="7" fill="#C084FC" fill-opacity="0.25" />

  <!-- INDUSTRIAL MACHINE SILHOUETTE / CHASSIS -->
  <rect x="30" y="44" width="140" height="54" rx="8" fill="rgba(255,255,255,0.08)" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.6" />
  <!-- HMI PANEL MOCKUP ON MACHINE -->
  <rect x="120" y="52" width="40" height="26" rx="4" fill="#C084FC" fill-opacity="0.3" stroke="#C084FC" stroke-width="1" />
  <!-- ROLLER / SPINDLE INDICATORS -->
  <circle cx="55" cy="71" r="14" fill="rgba(255,255,255,0.15)" stroke="#C084FC" stroke-width="1.2" />
  <circle cx="55" cy="71" r="5" fill="#C084FC" />
  <circle cx="95" cy="71" r="14" fill="rgba(255,255,255,0.15)" stroke="#C084FC" stroke-width="1.2" />
  <circle cx="95" cy="71" r="5" fill="#C084FC" />

  <!-- TITLE -->
  <text x="100" y="125" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.8">LINK CONNER</text>
</svg>